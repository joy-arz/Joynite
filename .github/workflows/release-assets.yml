name: Publish desktop packages
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful desktop build run containing Windows and Linux artifacts
        required: true
        type: string
      release_tag:
        description: Existing draft or published release tag
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Retrieve platform packages
        run: |
          gh run download "$ARTIFACT_RUN" --name JoyniteDesktop-Windows --dir packages/Windows
          gh run download "$ARTIFACT_RUN" --name JoyniteDesktop-Linux --dir packages/Linux
      - name: Publish verified build artifacts
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          files = sorted(str(p) for p in pathlib.Path('packages').rglob('*') if p.is_file() and p.suffix in {'.exe', '.deb', '.AppImage'})
          if len(files) != 3:
              raise SystemExit('Expected one Windows installer and two Linux packages')
          subprocess.run(['gh', 'release', 'view', os.environ['RELEASE_TAG']], check=True)
          subprocess.run(['gh', 'release', 'upload', os.environ['RELEASE_TAG'], *files, '--clobber'], check=True)
          PY
