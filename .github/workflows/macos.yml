name: macOS native build
on:
  push:
    paths: ['branding/**', 'macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['branding/**', 'macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate core behavior
        run: swift run --package-path macos PlayniteValidation
      - name: Build signed application bundle
        run: macos/scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PlayniteMac
          path: macos/dist/PlayniteMac-*.zip
